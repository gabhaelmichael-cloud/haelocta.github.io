<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel's Portal</title>
    <style>
        /* Custom Decorations */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .header {
            background: #24292e;
            color: white;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { color: #0366d6; }
        .btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background: #2c974b; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Welcome to My Website</h1>
        <p>A place for my friends to share and collaborate.</p>
    </div>

    <div class="card">
        <h2>About This Project</h2>
        <p>I'm building this site to collect and review submissions from my friends. Stay tuned for more updates!</p>
    </div>

    <div class="card">
        <h2>Submit Something</h2>
        <p>Ready to share your thoughts or files with me?</p>
        <a href="submit.html" class="btn">Go to Submission Page</a>
    </div>

</body>
</html>
