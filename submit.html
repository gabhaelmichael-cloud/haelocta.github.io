<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Data Submission Terminal</title>
    <!-- Tally Embed Script -->
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050505; 
            color: #e0e0e0;
            font-family: 'Cinzel', serif, system-ui;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Keeps the terminal look clean */
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.alphacoders.com/135/1359670.jpeg');
            background-size: cover;
            background-position: center;
        }

        .header-bar {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 1.2rem;
            color: #fff;
        }

        .iframe-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        .footer-nav {
            padding: 15px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .back-link {
            color: #444;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>Ingestion Terminal</h2>
    </div>

    <div class="iframe-container">
        <!-- Tally Iframe -->
        <iframe 
            data-tally-src="https://tally.so/r/rj2VML?transparentBackground=1" 
            width="100%" 
            height="100%" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0" 
            title="Upload the File">
        </iframe>
    </div>

    <div class="footer-nav">
        <a href="index.html" class="back-link">TERMINATE SESSION & RETURN</a>
    </div>

</body>
</html>
