<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Data Submission Terminal</title>
    <!-- Tally Embed Script -->
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            /* Set background to Sky Blue */
            background-color: #87CEEB; 
            color: #1a1a1a;
            font-family: 'Cinzel', serif, system-ui;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-bar {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.2); /* Light glass effect */
            backdrop-filter: blur(5px);
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 1.2rem;
            color: #000; /* Darker text for visibility on blue */
        }

        .iframe-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        .footer-nav {
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.1);
        }

        .return-btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #000;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.4s;
            background: rgba(0,0,0,0.05);
        }

        .return-btn:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>Ingestion Terminal</h2>
    </div>

    <div class="iframe-container">
        <!-- Tally Iframe with transparency enabled -->
        <iframe 
            data-tally-src="https://tally.so/r/rj2VML?transparentBackground=1" 
            width="100%" 
            height="100%" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0" 
            title="Upload the File">
        </iframe>
    </div>

    <div class="footer-nav">
        <a href="index.html" class="return-btn">Return to Command Center</a>
    </div>

</body>
</html>
