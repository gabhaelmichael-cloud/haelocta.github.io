<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Submission Terminal</title>
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.alphacoders.com/135/1359670.jpeg');
            background-size: cover;
            background-position: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border-radius: 4px;
        }
        h2 { text-transform: uppercase; letter-spacing: 4px; margin-bottom: 30px; text-align: center; }
        input, textarea, button {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .btn-send {
            background: none;
            border: 1px solid #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-send:hover { background: #fff; color: #000; }
        #status { font-size: 0.8rem; text-align: center; color: #888; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Ingestion Terminal</h2>
        <input type="text" id="operator_id" placeholder="OPERATOR ID" required>
        <input type="file" id="file_input">
        <textarea id="notes" placeholder="TRANSMISSION NOTES"></textarea>
        <button id="upload_btn" class="btn-send">Execute Transmission</button>
        <p id="status">STANDBY...</p>
        <a href="index.html" style="color:#555; text-decoration:none; display:block; text-align:center; font-size:0.7rem;">RETURN</a>
    </div>

    <script>
        // Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('upload_btn').addEventListener('click', async () => {
            const file = document.getElementById('file_input').files[0];
            const operatorId = document.getElementById('operator_id').value;
            const notes = document.getElementById('notes').value;
            const status = document.getElementById('status');

            if (!file || !operatorId) {
                status.innerText = "ERROR: INCOMPLETE DATA";
                return;
            }

            status.innerText = "UPLOADING FILE...";

            // 1. Upload File to Storage
            const fileName = `${Date.now()}_${file.name}`;
            const { data: storageData, error: storageError } = await supabase.storage
                .from('transmissions')
                .upload(fileName, file);

            if (storageError) {
                status.innerText = "STORAGE ERROR: " + storageError.message;
                return;
            }

            // 2. Get Public URL
            const { data: urlData } = supabase.storage
                .from('transmissions')
                .getPublicUrl(fileName);

            // 3. Save Record to SQL Database
            const { error: dbError } = await supabase
                .from('uploads')
                .insert([{ 
                    operator_id: operatorId, 
                    file_url: urlData.publicUrl, 
                    notes: notes 
                }]);

            if (dbError) {
                status.innerText = "DATABASE ERROR: " + dbError.message;
            } else {
                status.innerText = "TRANSMISSION SUCCESSFUL";
            }
        });
    </script>
</body>
</html>
